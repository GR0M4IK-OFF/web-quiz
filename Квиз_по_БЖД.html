<style>
:root{color-scheme:light;--bg:#f3f6fa;--card:#fff;--tx:#14202e;--mu:#5a6675;--ac:#0069d1;--acx:#fff;--rd:#d70000;--ok:#14804a;--okb:#e1f4e9;--er:#b3261e;--erb:#fde8e6;--bd:#d8dfe8;--h1:#0083fc;--tint:#e8f2fe;--ease:cubic-bezier(.22,.8,.3,1)}

.opts{padding-bottom:120px}

.opt:disabled{cursor:default}

[hidden]{display:none!important}

let mode="topic",per=5,run=null;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const G='<div class="gears" aria-hidden="true"><svg class="gear g1"><use href="#gear"/></svg><svg class="gear g2"><use href="#gear"/></svg></div>';

function home(){
 show(`<section class="hero">${G}<div class="in"><div class="brand"><img src="${LOGO}" alt="Логотип"><div><div class="t">Квиз по БЖД</div><div class="s">Безопасность жизнедеятельности</div></div></div>
 <h1>Проверь себя по 9 практическим занятиям</h1>
 <div class="seg"><i></i><button data-m="topic">По темам</button><button data-m="exam">Общий экзамен</button></div></div></section>
 <div class="wrap"><div class="card"><div class="row"><b>Вопросов на тему</b><span class="badge" id="pv"></span></div><input id="rg" type="range" min="1" max="${MAX}" aria-label="Вопросов на тему"><div class="mu" id="hint"></div></div>
 <div id="tp"><h3>Выберите тему</h3><div class="topics" id="tl"></div></div>
 <div id="ex" class="card"><h3>Общий экзамен</h3><p class="mu" id="ext"></p><button class="btn" id="go">Начать экзамен</button></div></div>`,"home");
 const view=()=>{
  const e=mode=="exam";$(".seg").dataset.m=mode;
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.m==mode));
  $("#pv").textContent=per;$("#rg").value=per;$("#rg").style.setProperty("--p",(per-1)/(MAX-1)*100+"%");
  $("#hint").textContent=e?`Всего в экзамене: ${per*9} ${pl(per*9)}`:`В каждой теме: ${per} ${pl(per)}`;

}
function ask(){
 const r=run,it=r.qs[r.i],n=r.qs.length,L="АБВГ";
 const prog=n<=12?`<div class="segs">${r.qs.map((_,k)=>`<i class="${k<r.i?"d":k==r.i?"c":""}"></i>`).join("")}</div>`:`<div class="pb"><i style="width:${r.i/n*100}%"></i></div>`;
 show(`<section class="hero">${G}<div class="in"><div class="top"><button class="back" id="bk" aria-label="В меню">‹</button><div class="chip">${T[it.q[0]]}</div></div>${prog}
 <div class="meta"><span>Вопрос ${r.i+1} из ${n}</span><span>Верно: <span id="sc">${r.ok}</span></span></div></div></section>
 <div class="wrap"><div class="qc">${it.q[1]}</div><div class="opts" id="os">${it.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span><span class="x">${o.x}</span><span class="mk"></span></button>`).join("")}<div id="fb"></div></div></div>
 <div class="act"><button class="btn" id="nb" disabled>Выберите ответ</button></div>`,"q");
 $("#bk").onclick=home;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k,good=it.o[k].c,all=document.querySelectorAll(".opt");
  all.forEach((e,j)=>{e.disabled=true;if(it.o[j].c){e.classList.add("ok");e.querySelector(".mk").textContent="✓"}});
  if(good)r.ok++;else{b.classList.add("bad");b.querySelector(".mk").textContent="✕";r.wrong.push({it,pick:it.o[k].x})}
  $("#sc").textContent=r.ok;
  const sg=document.querySelector(".segs i.c");if(sg)sg.className="d";
  $("#fb").innerHTML=good?`<div class="fb g"><b>Верно!</b></div>`:`<div class="fb w"><b>Не совсем</b><span>Верный ответ — ${it.q[2]}</span></div>`;
  const nb=$("#nb");nb.disabled=false;nb.textContent=r.i+1<n?"Далее":"Показать результат";
 });
 $("#nb").onclick=()=>{r.i++;r.i<n?ask():fin()};
}
function fin(){
 const r=run,n=r.qs.length,p=Math.round(r.ok/n*100),w=r.wrong.length;
 const g=p>=85?"Отлично":p>=65?"Хорошо":p>=50?"Удовлетворительно":"Нужно повторить";
 const h=w?`${w} ${w==1?"ошибка":w<5?"ошибки":"ошибок"}. Разберите ${w==1?"её":"их"} ниже`:"Ошибок нет, так держать";
 show(`<section class="hero">${G}<div class="in"><h2>Результат</h2><div class="ring"><b id="pc">0%</b>${r.ok} из ${n} верно</div><div class="grade">${g}</div><div class="hint">${h}</div></div></section>
 <div class="wrap"><div class="btns"><button class="btn full" id="again">Пройти заново</button>${w?`<button class="btn sec" id="rw">Повторить ошибки</button>`:""}<button class="btn sec ${w?"":"full"}" id="hm">В меню</button></div>
 ${w?`<h3>Разбор ошибок</h3>`+r.wrong.map((x,i)=>`<div class="rv" style="--d:${Math.min(i,8)*60+200}ms"><small>${T[x.it.q[0]]}</small><p>${x.it.q[1]}</p><span class="pill w">✕ ${x.pick}</span><span class="pill g">✓ ${x.it.q[2]}</span></div>`).join(""):""}</div>`,"res");
 const el=$("#pc"),t0=performance.now();
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)el.textContent=p+"%";
 else{const f=t=>{const k=Math.min(1,(t-t0-150)/800);el.textContent=Math.round(p*(1-Math.pow(1-Math.max(k,0),3)))+"%";if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
 const again=qs=>{run={qs:sh(qs).map(mk),i:0,ok:0,wrong:[]};ask()};
 $("#hm").onclick=home;$("#again").onclick=()=>again(r.qs.map(x=>x.q));
 if(w)$("#rw").onclick=()=>again(r.wrong.map(x=>x.it.q));
}
home();
</script></body></html>
